
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Order | Xenoriq Labs</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div class="container my-5">

        <h1 class="text-center mb-5">
            Bootstrap Column Ordering
        </h1>

        <!-- Example 1: Basic Ordering -->
        <h3 class="mb-3">1. Basic Ordering</h3>

        <div class="row mb-5">

            <div class="col-4 order-3 bg-primary text-white p-4">
                Column 1
            </div>

            <div class="col-4 order-1 bg-success text-white p-4">
                Column 2
            </div>

            <div class="col-4 order-2 bg-danger text-white p-4">
                Column 3
            </div>

        </div>


        <!-- Example 2: First and Last -->
        <h3 class="mb-3">2. Order First and Last</h3>

        <div class="row mb-5">

            <div class="col-4 order-last bg-primary text-white p-4">
                Column 1
            </div>

            <div class="col-4 bg-success text-white p-4">
                Column 2
            </div>

            <div class="col-4 order-first bg-danger text-white p-4">
                Column 3
            </div>

        </div>


        <!-- Example 3: Responsive Ordering -->
        <h3 class="mb-3">3. Responsive Ordering</h3>

        <div class="row">

            <!-- Image Section -->
            <div class="col-md-6 order-2 order-md-1 bg-primary text-white p-5">
                <h2>Image Section</h2>
                <p>Image appears first on desktop.</p>
            </div>

            <!-- Text Section -->
            <div class="col-md-6 order-1 order-md-2 bg-success text-white p-5">
                <h2>Text Section</h2>
                <p>Text appears first on mobile.</p>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
