<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Alignment</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center mb-5">
            Bootstrap Grid Alignment
        </h1>

        <!-- 1. Horizontal Alignment -->
        <h3>1. Horizontal Alignment</h3>

        <div class="row justify-content-center bg-light p-3 mb-5">

            <div class="col-3 bg-primary text-white p-3">
                Column 1
            </div>

            <div class="col-3 bg-success text-white p-3">
                Column 2
            </div>

        </div>

        <h3>2. Vertical Alignment</h3>

        <div class="row align-items-center bg-light mb-5" style="height: 200px;">

            <div class="col-4 bg-primary text-white p-3">
                Column 1
            </div>

            <div class="col-4 bg-success text-white p-3">
                Column 2
            </div>

        </div>


        <!-- 3. Individual Alignment -->
        <h3>3. Individual Alignment</h3>

        <div class="row bg-light mb-5" style="height: 200px;">

            <div class="col-4 align-self-start bg-primary text-white p-3">
                Top
            </div>

            <div class="col-4 align-self-center bg-success text-white p-3">
                Center
            </div>

            <div class="col-4 align-self-end bg-danger text-white p-3">
                Bottom
            </div>

        </div>

    </div>


    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
